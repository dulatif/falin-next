<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Next.js Powered By Section</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }

        /* --- 3D & Perspective Utilities --- */
        .perspective-1000 { perspective: 1000px; }
        .preserve-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; }

        .translate-z-10 { transform: translateZ(10px); }
        .translate-z-20 { transform: translateZ(20px); }
        .translate-z-30 { transform: translateZ(30px); }

        .bg-grid-pattern {
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 20px 20px;
        }

        .clip-path-triangle {
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
        }

        /* --- Animations --- */

        /* Floating Cards */
        @keyframes float {
            0%, 100% { transform: translateY(0) translateZ(20px); }
            50% { transform: translateY(-10px) translateZ(20px); }
        }
        .animate-float { animation: float 6s ease-in-out infinite; }

        /* Ripple for MUI */
        @keyframes ripple {
            0% { transform: scale(0.8); opacity: 1; }
            100% { transform: scale(2); opacity: 0; }
        }
        .animate-ripple { animation: ripple 3s linear infinite; }

        /* Wind for Next.js */
        @keyframes stream-right {
            0% { transform: translateX(-100%); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateX(100%); opacity: 0; }
        }
        .animate-stream-right { animation: stream-right 1.5s cubic-bezier(0.4, 0, 0.2, 1) infinite; }

        /* --- CIRCUIT ANIMATION (The Core Request) --- */

        @keyframes circuit-flow {
            to { stroke-dashoffset: 0; }
        }

        .circuit-line {
            /* Dasharray: 50px packet, 300px gap */
            stroke-dasharray: 50 300;
            /* Offset: Starts hidden (offset by gap length) */
            stroke-dashoffset: 350;
            animation: circuit-flow 1.5s linear infinite;
        }

        .circuit-line-delay-1 { animation-delay: 0.5s; }
        .circuit-line-delay-2 { animation-delay: 1.0s; }

    </style>
</head>
<body class="antialiased min-h-screen p-6 selection:bg-blue-100 selection:text-blue-900 flex items-center justify-center">

    <div class="max-w-7xl w-full mx-auto">

        <!-- CPU Label / Motherboard Chip -->
        <div class="relative z-20 flex justify-center mb-0">
            <div class="bg-slate-900 text-white text-xs font-mono font-bold py-3 px-8 rounded shadow-2xl flex items-center gap-3 relative border border-slate-700 ring-4 ring-slate-100/50">
                <!-- Decorative Gold Pins -->
                <div class="absolute -left-1.5 top-2 bottom-2 w-1 bg-gradient-to-b from-amber-400 via-amber-200 to-amber-500 rounded-l flex flex-col justify-between py-1 opacity-80"></div>
                <div class="absolute -right-1.5 top-2 bottom-2 w-1 bg-gradient-to-b from-amber-400 via-amber-200 to-amber-500 rounded-r flex flex-col justify-between py-1 opacity-80"></div>

                <!-- LED Status Lights -->
                <div class="w-2 h-2 bg-green-500 rounded-full animate-pulse shadow-[0_0_10px_#22c55e]"></div>
                POWERED BY
                <div class="w-2 h-2 bg-green-500 rounded-full animate-pulse shadow-[0_0_10px_#22c55e]"></div>

                <!-- Connection Point for SVG (Visual Anchor) -->
                <div class="absolute -bottom-1 left-1/2 -translate-x-1/2 w-8 h-1 bg-slate-700 rounded-b"></div>
            </div>
        </div>

        <!-- CIRCUIT BOARD CONNECTOR LAYER -->
        <!-- Fixed: Using viewBox and preserveAspectRatio="none" for valid scaling -->
        <div class="relative w-full h-24 -my-1 z-0 hidden md:block">
            <svg viewBox="0 0 1200 100" preserveAspectRatio="none" width="100%" height="100%" class="overflow-visible">
                <defs>
                    <!-- Vibrant Electric Gradient -->
                    <linearGradient id="electric-gradient" x1="0%" y1="100%" x2="0%" y2="0%">
                        <stop offset="0%" stop-color="#06b6d4" stop-opacity="0" />
                        <stop offset="50%" stop-color="#3b82f6" stop-opacity="1" />
                        <stop offset="100%" stop-color="#60a5fa" stop-opacity="1" />
                    </linearGradient>
                </defs>

                <!--
                   PATH LOGIC (Using 1200x100 grid):
                   - Left Card Center: x=200 (16.66% of 1200)
                   - Center Card Center: x=600 (50% of 1200)
                   - Right Card Center: x=1000 (83.33% of 1200)
                   - Chip Center: x=600
                -->

                <!-- Path 1: Left Card (200,100) -> Chip Left (580,0) -->
                <path d="M 200 100 V 50 H 580 V 0"
                      fill="none" stroke="#e2e8f0" stroke-width="2" vector-effect="non-scaling-stroke" />
                <path d="M 200 100 V 50 H 580 V 0"
                      fill="none" stroke="url(#electric-gradient)" stroke-width="4" stroke-linecap="round"
                      class="circuit-line" vector-effect="non-scaling-stroke" />

                <!-- Path 2: Center Card (600,100) -> Chip Center (600,0) -->
                <path d="M 600 100 V 0"
                      fill="none" stroke="#e2e8f0" stroke-width="2" vector-effect="non-scaling-stroke" />
                <path d="M 600 100 V 0"
                      fill="none" stroke="url(#electric-gradient)" stroke-width="4" stroke-linecap="round"
                      class="circuit-line circuit-line-delay-1" vector-effect="non-scaling-stroke" />

                <!-- Path 3: Right Card (1000,100) -> Chip Right (620,0) -->
                <path d="M 1000 100 V 50 H 620 V 0"
                      fill="none" stroke="#e2e8f0" stroke-width="2" vector-effect="non-scaling-stroke" />
                <path d="M 1000 100 V 50 H 620 V 0"
                      fill="none" stroke="url(#electric-gradient)" stroke-width="4" stroke-linecap="round"
                      class="circuit-line circuit-line-delay-2" vector-effect="non-scaling-stroke" />

                <!-- Connection Dots at the bottom (Card tops) -->
                <circle cx="200" cy="100" r="4" fill="#94a3b8" />
                <circle cx="600" cy="100" r="4" fill="#94a3b8" />
                <circle cx="1000" cy="100" r="4" fill="#94a3b8" />
            </svg>
        </div>

        <!-- Mobile Fallback Connector (Vertical Line) -->
        <div class="h-12 w-0.5 bg-gray-200 mx-auto md:hidden relative overflow-hidden">
             <div class="absolute top-0 left-0 w-full h-1/2 bg-blue-500 animate-[stream-right_1s_infinite_vertical]"></div>
        </div>

        <!-- Tech Stack Grid (Cards) -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-8 relative z-10">

            <!-- 1. TypeScript Card -->
            <div class="group relative bg-white border border-gray-200 rounded-2xl overflow-hidden hover:shadow-xl hover:shadow-blue-500/20 hover:border-blue-400 transition-all duration-500 perspective-1000">
                <!-- Top Connection Node -->
                <div class="absolute -top-1 left-1/2 -translate-x-1/2 w-12 h-1 bg-gray-300 rounded-b z-20 hidden md:block"></div>

                <div class="h-64 relative overflow-hidden bg-gray-50 transition-colors duration-700 group-hover:bg-[#3178C6]">
                    <div class="absolute inset-0 bg-grid-pattern opacity-30"></div>
                    <!-- 3D Scene -->
                    <div class="absolute inset-0 flex items-center justify-center preserve-3d group-hover:scale-110 transition-transform duration-500">
                        <!-- Orbiting Text -->
                        <div class="absolute top-10 left-10 font-mono text-[10px] text-gray-400 group-hover:text-blue-200 animate-float opacity-0 group-hover:opacity-100 transition-opacity">interface {}</div>
                        <div class="absolute bottom-10 right-10 font-mono text-[10px] text-gray-400 group-hover:text-blue-200 animate-float opacity-0 group-hover:opacity-100 transition-opacity" style="animation-delay: 1s;">type Props</div>

                        <!-- Logo Block -->
                        <div class="w-24 h-24 bg-[#3178C6] rounded-xl shadow-lg border-2 border-white/20 flex items-center justify-center text-white font-bold text-4xl translate-z-20 group-hover:bg-white group-hover:text-[#3178C6] transition-colors duration-500 animate-float relative">
                            TS
                            <div class="absolute inset-0 bg-gradient-to-tr from-white/20 to-transparent rounded-xl pointer-events-none"></div>
                        </div>
                    </div>
                </div>
                <div class="p-6">
                    <h3 class="font-bold text-lg mb-1 group-hover:text-blue-600 transition-colors">TypeScript</h3>
                    <p class="text-gray-500 text-xs">Statically typed superset of JavaScript.</p>
                </div>
            </div>

            <!-- 2. Next.js Card -->
            <div class="group relative bg-white border border-gray-200 rounded-2xl overflow-hidden hover:shadow-xl hover:shadow-gray-500/20 hover:border-black transition-all duration-500 perspective-1000">
                 <!-- Top Connection Node -->
                 <div class="absolute -top-1 left-1/2 -translate-x-1/2 w-12 h-1 bg-gray-300 rounded-b z-20 hidden md:block"></div>

                <div class="h-64 relative overflow-hidden bg-gray-50 transition-colors duration-700 group-hover:bg-black">
                    <!-- Wind/Speed Animation -->
                    <div class="absolute inset-0 opacity-0 group-hover:opacity-30 transition-opacity duration-500">
                         <div class="absolute top-1/4 left-0 w-full h-[1px] bg-white animate-stream-right"></div>
                         <div class="absolute top-2/4 left-0 w-full h-[1px] bg-white animate-stream-right" style="animation-delay: 0.2s;"></div>
                         <div class="absolute top-3/4 left-0 w-full h-[1px] bg-white animate-stream-right" style="animation-delay: 0.4s;"></div>
                    </div>

                    <div class="absolute inset-0 flex items-center justify-center preserve-3d group-hover:rotate-y-12 transition-transform duration-700">
                         <div class="w-24 h-24 bg-white rounded-full shadow-lg border border-gray-200 flex items-center justify-center translate-z-30 group-hover:border-white/20 group-hover:bg-black group-hover:shadow-[0_0_30px_rgba(255,255,255,0.2)] transition-all duration-500">
                             <div class="relative w-12 h-12">
                                 <div class="absolute inset-0 bg-black group-hover:bg-white transition-colors duration-500 clip-path-triangle"></div>
                             </div>
                         </div>
                         <div class="absolute bottom-20 w-16 h-4 bg-black/20 blur-md rounded-[100%] group-hover:bg-white/20 transition-colors duration-500 transform rotate-x-60"></div>
                    </div>
                </div>
                <div class="p-6">
                    <h3 class="font-bold text-lg mb-1 group-hover:text-black transition-colors">Next.js</h3>
                    <p class="text-gray-500 text-xs">The React Framework for the Web.</p>
                </div>
            </div>

            <!-- 3. Material UI Card -->
            <div class="group relative bg-white border border-gray-200 rounded-2xl overflow-hidden hover:shadow-xl hover:shadow-blue-400/20 hover:border-[#007FFF] transition-all duration-500 perspective-1000">
                 <!-- Top Connection Node -->
                 <div class="absolute -top-1 left-1/2 -translate-x-1/2 w-12 h-1 bg-gray-300 rounded-b z-20 hidden md:block"></div>

                <div class="h-64 relative overflow-hidden bg-gray-50 transition-colors duration-700 group-hover:bg-[#007FFF]">
                    <!-- Ripple Animation -->
                    <div class="absolute inset-0 flex items-center justify-center opacity-0 group-hover:opacity-20 transition-opacity duration-500">
                        <div class="w-40 h-40 border border-white rounded-full animate-ripple"></div>
                        <div class="w-40 h-40 border border-white rounded-full animate-ripple" style="animation-delay: 1s;"></div>
                    </div>

                    <!-- Stacked Paper Effect -->
                    <div class="absolute inset-0 flex items-center justify-center preserve-3d group-hover:rotate-x-12 group-hover:rotate-y-12 transition-transform duration-700">
                        <div class="w-20 h-20 bg-blue-100 rounded-lg shadow-md absolute translate-y-4 translate-x-4 translate-z-10 group-hover:bg-white/10 group-hover:border group-hover:border-white/20 transition-colors"></div>
                        <div class="w-20 h-20 bg-blue-300 rounded-lg shadow-md absolute translate-y-2 translate-x-2 translate-z-20 group-hover:bg-white/30 group-hover:border group-hover:border-white/30 transition-colors"></div>
                        <div class="w-20 h-20 bg-[#007FFF] rounded-lg shadow-xl absolute translate-z-30 flex items-center justify-center group-hover:bg-white group-hover:text-[#007FFF] text-white font-bold text-2xl transition-colors">
                            M
                        </div>
                    </div>
                </div>
                <div class="p-6">
                    <h3 class="font-bold text-lg mb-1 group-hover:text-[#007FFF] transition-colors">Material UI</h3>
                    <p class="text-gray-500 text-xs">MUI Core components for faster development.</p>
                </div>
            </div>

        </div>

    </div>

</body>
</html>
